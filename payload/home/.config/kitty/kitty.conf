# Gran defaults. Put personal overrides in ~/.config/kitty/kitty.conf.

# Font

# Window
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0

# Keybindings
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u
# Kitty legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u

# Allow local cwd lookup, but reject remote control through terminal output.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/gran-kitty-{kitty_pid}

# Aesthetics
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor
enable_audio_bell no

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Window layout belongs to the compositor, not Kitty's cached window state.
remember_window_size no

# Remove the include below to disconnect Kitty from Gran's theming system.
include themes/noctalia.conf

# Settings below override Gran's defaults in /etc/xdg/kitty/kitty.conf.
# Learn more: https://sw.kovidgoyal.net/kitty/conf/

# Font
# font_family JetBrainsMono Nerd Font
# font_size 12

# Window padding
# window_padding_width 14

# Unmap a shortcut, passing it through to the terminal application
# map ctrl+insert

# Set or replace a shortcut
# map ctrl+shift+c copy_to_clipboard

# Remove all inherited shortcuts, including Kitty's built-in shortcuts
# clear_all_shortcuts yes

# A opacidade fica a cargo do Hyprland (70% em foco / 45% sem foco).
background_opacity 1.0

# Use fish shell when opening terminal
shell /usr/bin/fish

# Smooth cursor trail, including single-character movements while typing.
cursor_trail 1
cursor_trail_start_threshold 1
cursor_trail_decay 0.1 0.25
