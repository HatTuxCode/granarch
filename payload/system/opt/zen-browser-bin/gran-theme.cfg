// GranArch: local Noctalia palette, independent of the browser profile.
pref("gran.theme.status", "initializing");
try {
  const Cc = Components.classes, Ci = Components.interfaces, Cu = Components.utils;
  const directories = Cc["@mozilla.org/file/directory_service;1"].getService(Ci.nsIProperties);
  const io = Cc["@mozilla.org/network/io-service;1"].getService(Ci.nsIIOService);
  const sheetService = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
  const file = directories.get("Home", Ci.nsIFile);
  for (const part of [".local", "state", "gran", "zen-browser.css"]) file.append(part);
  let previous = -1, registered = null;
  function refreshGranTheme() {
    try {
      const current = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
      current.initWithPath(file.path);
      if (!current.exists() || current.lastModifiedTime === previous) return;
      if (registered && sheetService.sheetRegistered(registered, sheetService.USER_SHEET))
        sheetService.unregisterSheet(registered, sheetService.USER_SHEET);
      const uri = io.newURI(io.newFileURI(current).spec + "?gran=" + current.lastModifiedTime);
      sheetService.loadAndRegisterSheet(uri, sheetService.USER_SHEET);
      registered = uri;
      previous = current.lastModifiedTime;
      pref("gran.theme.status", "loaded");
    } catch (error) { pref("gran.theme.status", "error: " + error); Cu.reportError("GranArch theme: " + error); }
  }
  refreshGranTheme();
  globalThis.granThemeTimer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
  globalThis.granThemeTimer.initWithCallback(refreshGranTheme, 2000, Ci.nsITimer.TYPE_REPEATING_SLACK);
} catch (error) { pref("gran.theme.status", "error: " + error); Components.utils.reportError("GranArch theme initialization: " + error); }
