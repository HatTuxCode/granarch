---
modules-search: [ /etc/calamares/modules, local ]
branding: granarch
prompt-install: false
dont-chroot: false
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - granbootstrap
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - granprofile
      - initcpiocfg
      - initcpio
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished
