            },
            {
              "output": "presence:Out",
              "input": "treble:In"
            }
          ],
          "inputs": [
            "bass:In"
          ],
          "outputs": [
            "treble:Out"
          ]
        },
        "audio.channels": 2,
        "audio.position": [
          "FL",
          "FR"
        ],
        "capture.props": {
          "media.class": "Audio/Sink",
          "node.name": "gran.equalizer",
          "node.description": "Gran Equalizer"
        },
        "playback.props": {
          "node.name": "gran.equalizer_output",
          "node.passive": true,
          "media.role": "DSP"
        }
