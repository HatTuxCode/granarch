        "media.name": "Gran Equalizer",
        "filter.graph": {
          "nodes": [
            {
              "type": "builtin",
              "name": "bass",
              "label": "bq_lowshelf",
              "control": {
                "Freq": 90.0,
                "Q": 0.7,
                "Gain": 3
              }
            },
            {
              "type": "builtin",
              "name": "lowmid",
              "label": "bq_peaking",
              "control": {
                "Freq": 300.0,
                "Q": 1.0,
                "Gain": 4
              }
            },
            {
              "type": "builtin",
              "name": "mid",
              "label": "bq_peaking",
              "control": {
                "Freq": 1000.0,
                "Q": 0.8,
                "Gain": -1
              }
            },
            {
              "type": "builtin",
              "name": "presence",
              "label": "bq_peaking",
              "control": {
                "Freq": 3300.0,
                "Q": 1.0,
                "Gain": 2
              }
            },
            {
              "type": "builtin",
              "name": "treble",
